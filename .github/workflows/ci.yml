# Integración continua. El desacople entre componentes se verifica acá, no
# por acuerdos entre integrantes: un cambio que rompe un contrato, o una
# implementación que no lo cumple, no puede mergearse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: Contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenAPI válido (Redocly)
        run: npx --yes @redocly/cli@2.76.0 lint reserva-cupos/contrato/openapi.yaml --config reserva-cupos/contrato/redocly.yaml

      - name: AsyncAPI válido
        run: npx --yes @asyncapi/cli@6.3.0 validate reserva-cupos/contrato/asyncapi.yaml

      - name: Sin cambios incompatibles respecto de main (oasdiff)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          mkdir -p /tmp/oas
          git show "$BASE:reserva-cupos/contrato/openapi.yaml" > /tmp/oas/base.yaml
          cp reserva-cupos/contrato/openapi.yaml reserva-cupos/contrato/oasdiff-excepciones.txt /tmp/oas/
          docker run --rm -v /tmp/oas:/specs:ro tufin/oasdiff:v1.11.7 \
            breaking /specs/base.yaml /specs/openapi.yaml \
            --fail-on ERR --err-ignore /specs/oasdiff-excepciones.txt

      - name: Mensajes compatibles con los de main (ejemplos de asyncapi.yaml)
        working-directory: reserva-cupos
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          (cd compartido && npm ci)
          pruebas/contrato/compatibilidad-mensajes.sh "$BASE"

  pruebas:
    name: Pruebas (${{ matrix.componente }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente:
          - compartido
          - servicios/api
          - servicios/worker
          - servicios/relay
          - servicios/notificador
          - clientes/aula
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias del módulo compartido
        working-directory: reserva-cupos/compartido
        run: npm ci

      - name: Pruebas
        working-directory: reserva-cupos/${{ matrix.componente }}
        run: |
          npm ci
          npm test

  consumidor:
    name: Aula contra el mock del contrato (Prism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mock de la API generado del contrato
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$PWD/reserva-cupos/contrato:/contrato:ro" \
            stoplight/prism:5 mock -d -m false -h 0.0.0.0 /contrato/openapi.yaml
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4010/v1/cambios -H "Authorization: Bearer x" && exit 0
            sleep 1
          done
          docker logs prism
          exit 1

      - name: Pruebas de Aula contra el mock
        env:
          PRISM_URL: http://localhost:4010
        run: |
          (cd reserva-cupos/compartido && npm ci)
          cd reserva-cupos/clientes/aula
          npm ci
          npm test

  # Desde la Entrega 5 el sistema se levanta siempre con TLS en todos los
  # saltos: Schemathesis, k6 y las suites verifican el certificado del
  # gateway con la CA que genera scripts/preparar-seguridad.js en el runner.
  integracion:
    name: Integración (Schemathesis, ráfaga y límite de tasa)
    runs-on: ubuntu-latest
    needs: [contratos, pruebas]
    defaults:
      run:
        working-directory: reserva-cupos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Certificados, identidades y clave del operador
        run: node scripts/sistema.js preparar

      - name: Levantar el sistema (réplica incluida)
        run: node scripts/sistema.js levantar

      - name: La API cumple el contrato (Schemathesis)
        run: |
          # Tenant propio, creado por la API de administración: los datos que
          # genera Schemathesis no se mezclan con los de Aula.
          CLAVE=$(node scripts/sistema.js tenant "Verificación del contrato" --limite 1000/1000)
          docker run --rm --network reserva-cupos-infra_publica \
            -e SCHEMATHESIS_HOOKS=/config/hooks.py \
            -v "$PWD/contrato:/contrato:ro" -v "$PWD/pruebas/contrato:/config:ro" \
            -v "$PWD/seguridad/local/ca.crt:/tls/ca.crt:ro" \
            schemathesis/schemathesis:4.33.1 --config-file /config/schemathesis.toml \
            run /contrato/openapi.yaml --url https://traefik --tls-verify /tls/ca.crt \
            -H "Authorization: Bearer $CLAVE" --exclude-tag administracion \
            --checks all --max-examples 25 --seed 2026 --generation-with-security-parameters false

      - name: La administración de tenants cumple el contrato (Schemathesis)
        run: |
          docker run --rm --network reserva-cupos-infra_publica \
            -v "$PWD/contrato:/contrato:ro" -v "$PWD/pruebas/contrato:/config:ro" \
            -v "$PWD/seguridad/local/ca.crt:/tls/ca.crt:ro" \
            schemathesis/schemathesis:4.33.1 --config-file /config/schemathesis.toml \
            run /contrato/openapi.yaml --url https://traefik --tls-verify /tls/ca.crt \
            -H "Authorization: Bearer $(cat seguridad/local/admin.key)" --include-tag administracion \
            --checks all --max-examples 25 --seed 2026 --generation-with-security-parameters false

      - name: Ráfaga de 500 solicitudes sobre 10 cupos (k6 por HTTPS)
        run: |
          CLAVE=$(node scripts/sistema.js tenant "CI ráfaga" --limite 1000/1000)
          docker compose run --rm k6 run -q -e API_KEY="$CLAVE" /pruebas/carga/rafaga.js

      - name: Límite de tasa por tenant (k6)
        run: |
          SATURADO=$(node scripts/sistema.js tenant "CI saturado" --limite 10/20)
          VECINO=$(node scripts/sistema.js tenant "CI vecino" --limite 10/20)
          docker compose run --rm k6 run -q -e CLAVE_SATURADO="$SATURADO" -e CLAVE_VECINO="$VECINO" /pruebas/carga/limite.js

      - name: Registros ante una falla
        if: failure()
        run: docker compose logs --tail=80

      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  seguridad:
    name: Seguridad, cifrado y matriz de fallos
    runs-on: ubuntu-latest
    needs: [contratos, pruebas]
    defaults:
      run:
        working-directory: reserva-cupos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Certificados, identidades y clave del operador
        run: node scripts/sistema.js preparar

      - name: Levantar el sistema (réplica incluida)
        run: node scripts/sistema.js levantar

      - name: Suites de seguridad (API, Aula y cifrado)
        run: node scripts/sistema.js seguridad

      - name: Recorrido funcional y escalado conservados de E6
        run: |
          rm -f ../docs/entrega-6/evidencias/01-recorrido.txt ../docs/entrega-6/evidencias/02-carga-escalado.txt
          node pruebas/final/recorrido.js
          node pruebas/final/carga-escalado.js

      # El failover va último: deja la réplica promovida. El escenario del
      # tenant no espera los ~6 minutos hasta la DLQ (sí en la corrida local
      # que deja las evidencias).
      - name: Matriz de fallos y failover del primario
        run: node pruebas/fallos/matriz.js --sin-dlq worker relay rabbitmq notificador api mysql-replica aula-db tenant mysql-primary

      - name: Registros ante una falla
        if: failure()
        run: docker compose logs --tail=80

      # Las evidencias no contienen claves: las genera el runner con su
      # propia CA y credenciales efímeras.
      - name: Guardar las evidencias de la corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-integracion
          path: |
            docs/entrega-5/evidencias/
            docs/entrega-6/evidencias/*.txt
          if-no-files-found: ignore

      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  escalabilidad:
    name: E6 Redis, circuitos, carga y fallos parciales
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [contratos, pruebas]
    defaults:
      run:
        working-directory: reserva-cupos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Levantar cuatro particiones con TLS y Redis
        run: node scripts/verificar-e6.js levantar
      - name: Pruebas de exportacion segura de reportes
        run: node --test pruebas/final/test/*.test.js
      - name: Circuito por tenant y recuperacion
        run: node scripts/verificar-e6.js circuito
      - name: Redis global, cache e instancias 1-2-4
        run: node scripts/verificar-e6.js redis
      - name: Orden por actividad con cuatro particiones
        run: node pruebas/final/particiones.js 4
      - name: Carga caliente, multitenant y rampa con reportes
        run: node scripts/verificar-e6.js carga
      - name: API y worker detenidos durante la rafaga
        run: node scripts/verificar-e6.js fallos
      - name: Logs si falla
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.particiones.yml logs --tail=100
      - name: Evidencias reales de E6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-escalabilidad
          path: docs/entrega-6/evidencias/
      - name: Retirar entorno efimero de CI
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.particiones.yml -f docker-compose.pruebas-e6.yml down -v --remove-orphans

  # Único check obligatorio de main. GitHub cuenta como exitoso un job
  # salteado: si falla una prueba, la integración no corre y, sin este job,
  # la PR quedaría habilitada para el merge. Acá se exige que cada job haya
  # terminado bien, también los de la matriz.
  resultado:
    name: CI completo
    runs-on: ubuntu-latest
    needs: [contratos, pruebas, consumidor, integracion, seguridad, escalabilidad]
    if: always()
    steps:
      - name: Todos los jobs terminaron bien
        env:
          CONTRATOS: ${{ needs.contratos.result }}
          PRUEBAS: ${{ needs.pruebas.result }}
          CONSUMIDOR: ${{ needs.consumidor.result }}
          INTEGRACION: ${{ needs.integracion.result }}
          SEGURIDAD: ${{ needs.seguridad.result }}
          ESCALABILIDAD: ${{ needs.escalabilidad.result }}
        run: |
          echo "contratos: $CONTRATOS · pruebas: $PRUEBAS · consumidor: $CONSUMIDOR · integración: $INTEGRACION · seguridad: $SEGURIDAD"
          for resultado in "$CONTRATOS" "$PRUEBAS" "$CONSUMIDOR" "$INTEGRACION" "$SEGURIDAD" "$ESCALABILIDAD"; do
            if [ "$resultado" != success ]; then
              echo "::error::Hay un job que no terminó bien: la PR no se puede mergear"
              exit 1
            fi
          done
