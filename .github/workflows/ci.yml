# Integración continua. El desacople entre componentes se verifica acá, no
# por acuerdos entre integrantes: un cambio que rompe un contrato, o una
# implementación que no lo cumple, no puede mergearse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contratos:
    name: Contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OpenAPI válido (Redocly)
        run: npx --yes @redocly/cli@2.76.0 lint reserva-cupos/contrato/openapi.yaml --config reserva-cupos/contrato/redocly.yaml

      - name: AsyncAPI válido
        run: npx --yes @asyncapi/cli@6.3.0 validate reserva-cupos/contrato/asyncapi.yaml

      - name: Sin cambios incompatibles respecto de main (oasdiff)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          mkdir -p /tmp/oas
          git show "$BASE:reserva-cupos/contrato/openapi.yaml" > /tmp/oas/base.yaml
          cp reserva-cupos/contrato/openapi.yaml reserva-cupos/contrato/oasdiff-excepciones.txt /tmp/oas/
          docker run --rm -v /tmp/oas:/specs:ro tufin/oasdiff:v1.11.7 \
            breaking /specs/base.yaml /specs/openapi.yaml \
            --fail-on ERR --err-ignore /specs/oasdiff-excepciones.txt

      - name: Mensajes compatibles con los de main (ejemplos de asyncapi.yaml)
        working-directory: reserva-cupos
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          (cd compartido && npm ci)
          pruebas/contrato/compatibilidad-mensajes.sh "$BASE"

  pruebas:
    name: Pruebas (${{ matrix.componente }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        componente:
          - compartido
          - servicios/api
          - servicios/worker
          - servicios/relay
          - servicios/notificador
          - clientes/aula
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias del módulo compartido
        working-directory: reserva-cupos/compartido
        run: npm ci

      - name: Pruebas
        working-directory: reserva-cupos/${{ matrix.componente }}
        run: |
          npm ci
          npm test

  consumidor:
    name: Aula contra el mock del contrato (Prism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mock de la API generado del contrato
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$PWD/reserva-cupos/contrato:/contrato:ro" \
            stoplight/prism:5 mock -d -m false -h 0.0.0.0 /contrato/openapi.yaml
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4010/v1/cambios -H "Authorization: Bearer x" && exit 0
            sleep 1
          done
          docker logs prism
          exit 1

      - name: Pruebas de Aula contra el mock
        env:
          PRISM_URL: http://localhost:4010
        run: |
          (cd reserva-cupos/compartido && npm ci)
          cd reserva-cupos/clientes/aula
          npm ci
          npm test

  integracion:
    name: Integración (Schemathesis y ráfaga)
    runs-on: ubuntu-latest
    needs: [contratos, pruebas]
    defaults:
      run:
        working-directory: reserva-cupos
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el sistema
        run: |
          docker compose up --build -d --wait
          docker compose exec -T mysql-replica sh -c "mysql -uroot -proot_local_2026 < /configurar-replica.sql"

      - name: La API cumple el contrato (Schemathesis)
        run: |
          # Tenant propio: los datos que genera Schemathesis no se mezclan
          # con los de Aula.
          CLAVE=$(docker compose exec -T mysql-primary mysql -uroot -proot_local_2026 reservas -N \
            -e "SET @nombre = 'Verificación del contrato'; SOURCE /crear-tenant.sql" | awk '{print $NF}' | tail -1)
          docker run --rm --network reserva-cupos-infra_publica \
            -e SCHEMATHESIS_HOOKS=/config/hooks.py \
            -v "$PWD/contrato:/contrato:ro" -v "$PWD/pruebas/contrato:/config:ro" \
            schemathesis/schemathesis:4.33.1 --config-file /config/schemathesis.toml \
            run /contrato/openapi.yaml --url http://traefik \
            -H "Authorization: Bearer $CLAVE" \
            --checks all --max-examples 25 --seed 2026 --generation-with-security-parameters false

      - name: Ráfaga de 500 solicitudes sobre 10 cupos
        run: |
          CLAVE=$(docker compose exec -T mysql-primary mysql -uroot -proot_local_2026 reservas -N \
            -e "SET @nombre = 'CI'; SOURCE /crear-tenant.sql" | awk '{print $NF}' | tail -1)
          docker compose run --rm k6 run -q -e API_KEY="$CLAVE" /pruebas/carga/rafaga.js

      - name: Registros ante una falla
        if: failure()
        run: docker compose logs --tail=80

      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  seguridad:
    name: Seguridad y recuperación TLS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reserva-cupos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar certificados y usuarios locales
        run: node scripts/entrega5.js preparar
      - name: Pruebas TLS y de rutas reales de Aula
        run: |
          (cd compartido && npm ci)
          (cd clientes/aula && npm ci)
          node --test clientes/aula/test/*.test.js pruebas/seguridad/tls.test.js
      - name: Levantar entorno cifrado y migrar
        run: |
          node scripts/entrega5.js levantar
          node scripts/entrega5.js migrar
      - name: Acceso, cifrado y recuperación ante caída
        run: node scripts/entrega5.js pruebas
      - name: Registros ante una falla
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.seguridad.yml logs --tail=50
      - name: Guardar evidencia de integración (sin claves)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-entrega5
          path: docs/entrega-5/evidencias/integracion.txt
          if-no-files-found: ignore
      - name: Detener entorno efímero del CI
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.seguridad.yml down -v

  # Único check obligatorio de main. GitHub cuenta como exitoso un job
  # salteado: si falla una prueba, la integración no corre y, sin este job,
  # la PR quedaría habilitada para el merge. Acá se exige que cada job haya
  # terminado bien, también los de la matriz.
  resultado:
    name: CI completo
    runs-on: ubuntu-latest
    needs: [contratos, pruebas, consumidor, integracion, seguridad]
    if: always()
    steps:
      - name: Todos los jobs terminaron bien
        env:
          CONTRATOS: ${{ needs.contratos.result }}
          PRUEBAS: ${{ needs.pruebas.result }}
          CONSUMIDOR: ${{ needs.consumidor.result }}
          INTEGRACION: ${{ needs.integracion.result }}
          SEGURIDAD: ${{ needs.seguridad.result }}
        run: |
          echo "contratos: $CONTRATOS · pruebas: $PRUEBAS · consumidor: $CONSUMIDOR · integración: $INTEGRACION"
          for resultado in "$CONTRATOS" "$PRUEBAS" "$CONSUMIDOR" "$INTEGRACION" "$SEGURIDAD"; do
            if [ "$resultado" != success ]; then
              echo "::error::Hay un job que no terminó bien: la PR no se puede mergear"
              exit 1
            fi
          done
