name: reserva-cupos-infra

# Desde la Entrega 5 todo el tráfico entre componentes va cifrado con TLS y
# verificación del certificado. Los certificados, las identidades de Aula y
# la clave del operador los genera scripts/preparar-seguridad.js en
# seguridad/local/ (excluido de Git); sin ese paso, el entorno no arranca:
# cada montaje de un archivo de seguridad es un bind que exige que exista.

# Certificado de la CA local: con él cada cliente verifica al servidor.
x-ca: &ca
  type: bind
  source: ./seguridad/local/ca.crt
  target: /tls/ca.crt
  read_only: true

services:
  redis:
    image: redis:8.2-alpine
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    environment:
      REDISCLI_AUTH: redis_local_2026
    volumes:
      - redis-data:/data
      - ./Infraestructura/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - *ca
      - { type: bind, source: ./seguridad/local/redis.crt, target: /tls/redis.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/redis.key, target: /tls/redis.key, read_only: true }
    networks: [interna]
    healthcheck:
      test: [CMD, redis-cli, --tls, --cacert, /tls/ca.crt, -h, redis, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    build:
      context: ./Infraestructura/rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo_local_2026

    # Solo AMQPS (5671) y la administración por HTTPS (15671, publicada en
    # el 15672 del host). El listener AMQP sin TLS está deshabilitado.
    ports:
      - "127.0.0.1:15672:15671"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./Infraestructura/tls/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - *ca
      - { type: bind, source: ./seguridad/local/rabbitmq.crt, target: /tls/rabbitmq.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/rabbitmq.key, target: /tls/rabbitmq.key, read_only: true }

    networks:
      - interna

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

    restart: unless-stopped

  # Traefik no monta el socket de Docker: lo consulta a través de este
  # proxy, que solo deja pasar lecturas de contenedores, eventos y versión.
  # Cualquier escritura (crear, iniciar o borrar contenedores) responde 403.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2

    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # Red interna sin salida: solo Traefik llega al proxy.
    networks:
      - docker

    restart: unless-stopped

  # Gateway y descubrimiento de servicios. Traefik observa Docker y
  # registra cada contenedor con la etiqueta traefik.enable: al escalar la
  # API (docker compose up --scale api=3) toma las instancias nuevas sin
  # tocar configuración, les hace health check y balancea entre ellas.
  traefik:
    image: traefik:v3.6

    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=reserva-cupos-infra_publica
      - --providers.file.filename=/etc/traefik/tls.yml
      - --entryPoints.metrics.address=:9464
      - --metrics.prometheus=true
      - --metrics.prometheus.manualRouting=true
      - --metrics.prometheus.addRoutersLabels=true
      - --entryPoints.websecure.address=:443
      - --entryPoints.traefik.address=:8080
      - --entryPoints.ping.address=:8082
      - --api.dashboard=true
      - --ping=true
      - --ping.entryPoint=ping

    # El puerto 3000 del host sigue siendo la entrada a la API, ahora por
    # HTTPS; el 8080 muestra el panel con los servicios descubiertos, también
    # por HTTPS. El ping del health check (8082) no se publica.
    ports:
      - "127.0.0.1:3000:443"
      - "127.0.0.1:8080:8080"

    volumes:
      - ./Infraestructura/tls/traefik.yml:/etc/traefik/tls.yml:ro
      - *ca
      - { type: bind, source: ./seguridad/local/traefik.crt, target: /tls/traefik.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/traefik.key, target: /tls/traefik.key, read_only: true }

    networks:
      - publica
      - docker
      - interna

    depends_on:
      - socket-proxy

    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
        - --ping.entryPoint=ping
        - --entryPoints.ping.address=:8082
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  api:
    build:
      context: ./servicios/api
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    # La API no publica en RabbitMQ: escribe la reserva y su comando en el
    # outbox de MySQL, y el relay los publica.
    environment:
      PORT: "3000"
      TLS_CERT: /tls/api.crt
      TLS_KEY: /tls/api.key
      TLS_CA: /tls/ca.crt
      # El health check (fetch de Node) verifica el certificado propio.
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: api_app
      DB_PASSWORD: api_local_2026
      # Solo las rutas /admin/v1 usan este usuario.
      DB_ADMIN_USER: admin_app
      DB_ADMIN_PASSWORD: admin_local_2026
      # Hash de la clave del operador; la clave no llega al contenedor.
      ADMIN_CLAVE_SHA256_ARCHIVO: /seguridad/admin.sha256
      REDIS_URL: rediss://redis:6379
      REDIS_PASSWORD: redis_local_2026
      # Límite de tasa por defecto de cada tenant (token bucket).
      LIMITE_POR_SEGUNDO: "50"
      LIMITE_RAFAGA: "100"
      # Entorno de desarrollo: también se validan las respuestas contra el
      # contrato. Una respuesta fuera de contrato responde 500.
      VALIDAR_RESPUESTAS: "true"

    # Sin puertos propios: se entra por Traefik, que encuentra cada
    # instancia por estas etiquetas y le habla por HTTPS.
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/v1`) || PathPrefix(`/admin`) || Path(`/health`)"
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.server.scheme: https
      traefik.http.services.api.loadbalancer.serverstransport: api-tls@file
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 3s

    volumes:
      - *ca
      - { type: bind, source: ./seguridad/local/api.crt, target: /tls/api.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/api.key, target: /tls/api.key, read_only: true }
      - { type: bind, source: ./seguridad/local/admin.sha256, target: /seguridad/admin.sha256, read_only: true }

    networks:
      - publica
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  worker:
    build:
      context: ./servicios/worker
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      TLS_CA: /tls/ca.crt
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: worker_app
      DB_PASSWORD: worker_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026
      TLS_CERT: /tls/worker.crt
      TLS_KEY: /tls/worker.key
      NODE_EXTRA_CA_CERTS: /tls/ca.crt

    volumes:
      - *ca
      - type: bind
        source: ./seguridad/local/worker.crt
        target: /tls/worker.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/worker.key
        target: /tls/worker.key
        read_only: true

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # MySQL exige TLS en toda conexión por red (require_secure_transport); la
  # administración por el socket local del contenedor no es tráfico entre
  # componentes.
  mysql-primary:
    build:
      context: ./Infraestructura/mysql/primary

    command:
      - mysqld
      - --ssl-ca=/tls/ca.crt
      - --ssl-cert=/tls/mysql-primary.crt
      - --ssl-key=/tls/mysql-primary.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3

    environment:
      MYSQL_ROOT_PASSWORD: root_local_2026

    volumes:
      - mysql-primary-data:/var/lib/mysql
      - *ca
      - type: bind
        source: ./seguridad/local/mysql-primary.crt
        target: /tls/mysql-primary.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/mysql-primary.key
        target: /tls/mysql-primary.key
        read_only: true

    networks:
      - interna

    healthcheck:
      test:
        - CMD
        - mysql
        - -h
        - "127.0.0.1"
        - -uroot
        - -proot_local_2026
        - -e
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

    restart: unless-stopped

  mysql-replica:
    build:
      context: ./Infraestructura/mysql/replica

    command:
      - mysqld
      - --ssl-ca=/tls/ca.crt
      - --ssl-cert=/tls/mysql-replica.crt
      - --ssl-key=/tls/mysql-replica.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3

    environment:
      MYSQL_ROOT_PASSWORD: root_local_2026

    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./Infraestructura/mysql/replica/configurar-replica.sql:/configurar-replica.sql:ro
      - *ca
      - { type: bind, source: ./seguridad/local/mysql-replica.crt, target: /tls/mysql-replica.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/mysql-replica.key, target: /tls/mysql-replica.key, read_only: true }

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - mysql
        - -h
        - "127.0.0.1"
        - -uroot
        - -proot_local_2026
        - -e
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

    restart: unless-stopped

  aula-db:
    image: postgres:16-alpine

    # PostgreSQL exige que la clave privada tenga permisos 0600 y sea del
    # usuario postgres. Un bind desde Windows no conserva permisos POSIX,
    # así que se copia dentro del contenedor antes de arrancar.
    entrypoint: [sh, -c]
    command:
      - >-
        cp /certificados/aula-db.key /tmp/aula-db.key &&
        chown postgres:postgres /tmp/aula-db.key &&
        chmod 600 /tmp/aula-db.key &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/tls/aula-db.crt
        -c ssl_key_file=/tmp/aula-db.key
        -c ssl_min_protocol_version=TLSv1.2
        -c hba_file=/etc/postgresql/pg_hba.conf

    environment:
      POSTGRES_DB: aula
      POSTGRES_USER: aula_admin
      POSTGRES_PASSWORD: postgres_local_2026

    volumes:
      - aula-db-data:/var/lib/postgresql/data
      - ./Infraestructura/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # pg_hba rechaza cualquier conexión de red sin TLS.
      - ./Infraestructura/tls/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - *ca
      - { type: bind, source: ./seguridad/local/aula-db.crt, target: /tls/aula-db.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/aula-db.key, target: /certificados/aula-db.key, read_only: true }

    networks:
      - tenant

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - "127.0.0.1"
        - -U
        - aula_admin
        - -d
        - aula
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

  aula:
    build:
      context: ./clientes/aula
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      PORT: "3001"
      TLS_CERT: /tls/aula.crt
      TLS_KEY: /tls/aula.key
      TLS_CA: /tls/ca.crt
      # fetch de Node (llamadas a la API por el gateway) confía en la CA local.
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      # Aula entra por el gateway: no conoce las instancias de la API.
      API_URL: https://traefik
      # Clave de API del tenant Aula, solo para desarrollo local.
      API_KEY: rc_aula_5589268069a379faa72a98ae640f818c09fc6179adf5f2146bd97aadbb06bc42
      # Secreto del webhook, compartido con el servicio (03-tenants.sql).
      # Solo para desarrollo local.
      WEBHOOK_SECRET: 46cf76594518a3abd7580dce6146a6db58d2719b2602308e8f7c7dcb7024eb6d
      USUARIOS_ARCHIVO: /seguridad/usuarios.json
      PGHOST: aula-db
      PGPORT: "5432"
      PGDATABASE: aula
      PGUSER: aula_app
      PGPASSWORD: aula_local_2026

    ports:
      - "127.0.0.1:3001:3001"

    volumes:
      - *ca
      - { type: bind, source: ./seguridad/local/aula.crt, target: /tls/aula.crt, read_only: true }
      - { type: bind, source: ./seguridad/local/aula.key, target: /tls/aula.key, read_only: true }
      - { type: bind, source: ./seguridad/local/usuarios.json, target: /seguridad/usuarios.json, read_only: true }

    networks:
      - publica
      - tenant

    depends_on:
      api:
        condition: service_healthy
      traefik:
        condition: service_healthy
      aula-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('https://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  relay:
    build:
      context: ./servicios/relay
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      TLS_CA: /tls/ca.crt
      TLS_CERT: /tls/relay.crt
      TLS_KEY: /tls/relay.key
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: relay_app
      DB_PASSWORD: relay_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026

    volumes:
      - *ca
      - type: bind
        source: ./seguridad/local/relay.crt
        target: /tls/relay.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/relay.key
        target: /tls/relay.key
        read_only: true

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  notificador:
    build:
      context: ./servicios/notificador
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      TLS_CA: /tls/ca.crt
      # Los webhooks a Aula van por HTTPS: el notificador confía en la CA
      # local y rechaza (a la DLQ) cualquier URL http://.
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: notificador_app
      DB_PASSWORD: notificador_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026
      # Protección contra SSRF: solo se admiten destinos internos de esta
      # lista. En el entorno local, el receptor de Aula.
      NOTIFICADOR_HOSTS_PERMITIDOS: aula
      WEBHOOK_TIMEOUT_MS: "5000"
      TLS_CERT: /tls/notificador.crt
      TLS_KEY: /tls/notificador.key

    volumes:
      - *ca
      - type: bind
        source: ./seguridad/local/notificador.crt
        target: /tls/notificador.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/notificador.key
        target: /tls/notificador.key
        read_only: true

    networks:
      - interna
      - publica

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # Herramienta de pruebas de carga. No arranca con "docker compose up":
  # se ejecuta con "docker compose run --rm k6 ...". Verifica el
  # certificado del gateway con la CA local (SSL_CERT_FILE).
  k6:
    image: grafana/k6:1.0.0
    profiles:
      - pruebas

    environment:
      API_URL: https://traefik
      SSL_CERT_FILE: /tls/ca.crt

    volumes:
      - ./pruebas:/pruebas:ro
      - *ca

    networks:
      - publica

  prometheus:
    image: prom/prometheus:v3.5.0

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - prometheus-data:/prometheus
      - *ca
      - type: bind
        source: ./Infraestructura/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./Infraestructura/prometheus/web.yml
        target: /etc/prometheus/web.yml
        read_only: true
      - type: bind
        source: ./seguridad/local/prometheus.crt
        target: /tls/prometheus.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/prometheus.key
        target: /tls/prometheus.key
        read_only: true

    networks:
      - interna

    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.3.1

    environment:
      SSL_CERT_FILE: /tls/ca.crt
      GF_SERVER_PROTOCOL: https
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: https://localhost:3002
      GF_SERVER_CERT_FILE: /tls/grafana.crt
      GF_SERVER_CERT_KEY: /tls/grafana.key
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3002:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - *ca
      - type: bind
        source: ./Infraestructura/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./Infraestructura/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - type: bind
        source: ./seguridad/local/grafana.crt
        target: /tls/grafana.crt
        read_only: true
      - type: bind
        source: ./seguridad/local/grafana.key
        target: /tls/grafana.key
        read_only: true

    networks:
      - interna

    depends_on:
      prometheus:
        condition: service_started

    restart: unless-stopped

networks:
  publica:
  interna:
  tenant:
  # Solo Traefik y el proxy del socket; sin salida a otras redes.
  docker:
    internal: true

volumes:
  redis-data:
  rabbitmq-data:
  mysql-primary-data:
  mysql-replica-data:
  aula-db-data:
  prometheus-data:
  grafana-data:
