name: reserva-cupos-infra

services:
  rabbitmq:
    build:
      context: ./Infraestructura/rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo_local_2026

    ports:
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - interna

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  # Gateway y descubrimiento de servicios. Traefik observa Docker y
  # registra cada contenedor con la etiqueta traefik.enable: al escalar la
  # API (docker compose up --scale api=3) toma las instancias nuevas sin
  # tocar configuración, les hace health check y balancea entre ellas.
  traefik:
    image: traefik:v3.6

    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=reserva-cupos-infra_publica
      - --entryPoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true

    # El puerto 3000 del host sigue siendo la entrada a la API; el 8080
    # muestra el panel con los servicios descubiertos.
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:8080:8080"

    # Solo lectura: Traefik observa los contenedores, no los modifica.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - publica

    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  api:
    build:
      context: ./servicios/api
      additional_contexts:
        contrato: ./contrato

    # La API no publica en RabbitMQ: escribe la reserva y su comando en el
    # outbox de MySQL, y el relay los publica.
    environment:
      PORT: "3000"
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: api_app
      DB_PASSWORD: api_local_2026
      # Entorno de desarrollo: también se validan las respuestas contra el
      # contrato. Una respuesta fuera de contrato responde 500.
      VALIDAR_RESPUESTAS: "true"

    # Sin puertos propios: se entra por Traefik, que encuentra cada
    # instancia por estas etiquetas.
    labels:
      traefik.enable: "true"
      traefik.http.routers.api.rule: "PathPrefix(`/v1`) || Path(`/health`)"
      traefik.http.routers.api.entrypoints: web
      traefik.http.services.api.loadbalancer.server.port: "3000"
      traefik.http.services.api.loadbalancer.healthcheck.path: /health
      traefik.http.services.api.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.api.loadbalancer.healthcheck.timeout: 3s

    networks:
      - publica
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  worker:
    build:
      context: ./servicios/worker
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: worker_app
      DB_PASSWORD: worker_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  mysql-primary:
    build:
      context: ./Infraestructura/mysql/primary

    environment:
      MYSQL_ROOT_PASSWORD: root_local_2026

    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./Infraestructura/mysql/primary/crear-tenant.sql:/crear-tenant.sql:ro

    networks:
      - interna

    healthcheck:
      test:
        - CMD
        - mysql
        - -h
        - "127.0.0.1"
        - -uroot
        - -proot_local_2026
        - -e
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

    restart: unless-stopped

  mysql-replica:
    build:
      context: ./Infraestructura/mysql/replica

    environment:
      MYSQL_ROOT_PASSWORD: root_local_2026

    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./Infraestructura/mysql/replica/configurar-replica.sql:/configurar-replica.sql:ro

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - mysql
        - -h
        - "127.0.0.1"
        - -uroot
        - -proot_local_2026
        - -e
        - "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

    restart: unless-stopped

  aula-db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: aula
      POSTGRES_USER: aula_admin
      POSTGRES_PASSWORD: postgres_local_2026

    volumes:
      - aula-db-data:/var/lib/postgresql/data
      - ./Infraestructura/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - tenant

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - "127.0.0.1"
        - -U
        - aula_admin
        - -d
        - aula
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

  aula:
    build:
      context: ./clientes/aula
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      PORT: "3001"
      # Aula entra por el gateway: no conoce las instancias de la API.
      API_URL: http://traefik
      # Clave de API del tenant Aula, solo para desarrollo local.
      API_KEY: rc_aula_5589268069a379faa72a98ae640f818c09fc6179adf5f2146bd97aadbb06bc42
      # Secreto del webhook, compartido con el servicio (03-tenants.sql).
      # Solo para desarrollo local.
      WEBHOOK_SECRET: 46cf76594518a3abd7580dce6146a6db58d2719b2602308e8f7c7dcb7024eb6d
      PGHOST: aula-db
      PGPORT: "5432"
      PGDATABASE: aula
      PGUSER: aula_app
      PGPASSWORD: aula_local_2026

    ports:
      - "127.0.0.1:3001:3001"

    networks:
      - publica
      - tenant

    depends_on:
      api:
        condition: service_healthy
      traefik:
        condition: service_healthy
      aula-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  relay:
    build:
      context: ./servicios/relay
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: relay_app
      DB_PASSWORD: relay_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026

    networks:
      - interna

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  notificador:
    build:
      context: ./servicios/notificador
      additional_contexts:
        compartido: ./compartido
        contrato: ./contrato

    environment:
      DB_HOST: mysql-primary
      DB_NAME: reservas
      DB_USER: notificador_app
      DB_PASSWORD: notificador_local_2026
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: demo
      RABBITMQ_PASSWORD: demo_local_2026
      # Protección contra SSRF: solo se admiten destinos internos de esta
      # lista. En el entorno local, el receptor de Aula.
      NOTIFICADOR_HOSTS_PERMITIDOS: aula
      WEBHOOK_TIMEOUT_MS: "5000"

    networks:
      - interna
      - publica

    depends_on:
      mysql-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped

  # Herramienta de pruebas de carga. No arranca con "docker compose up":
  # se ejecuta con "docker compose run --rm k6 ...".
  k6:
    image: grafana/k6:1.0.0
    profiles:
      - pruebas

    environment:
      API_URL: http://traefik

    volumes:
      - ./pruebas:/pruebas:ro

    networks:
      - publica

networks:
  publica:
  interna:
  tenant:

volumes:
  rabbitmq-data:
  mysql-primary-data:
  mysql-replica-data:
  aula-db-data: