openapi: 3.1.0

info:
  title: Servicio multi-tenant de reserva de cupos
  version: 1.1.0
  summary: API pública v1 (Entrega 4)
  description: |
    Contrato de la API pública. Cada organización consumidora es un tenant
    que se autentica con su propia clave; el tenant se deriva siempre de la
    clave y nunca de la ruta ni del cuerpo. Un recurso de otro tenant
    responde `404`, igual que uno inexistente.

    La admisión de una reserva es síncrona y la decisión es asíncrona:
    `POST /v1/actividades/{id}/reservas` registra la reserva como
    `pendiente` y responde `202` con `Location`; el worker la confirma o la
    rechaza después. El cliente consulta el resultado en `Location`
    respetando `Retry-After`.

    La cancelación sigue el mismo modelo: `POST /v1/reservas/{id}/cancelacion`
    registra el pedido y responde `202`; el worker devuelve el cupo.

    Cada decisión del worker sobre una reserva se notifica al tenant con un
    webhook firmado (sección `webhooks`). El webhook es un mecanismo de baja
    latencia; la garantía la da el feed `GET /v1/cambios`.

    Los errores se devuelven como Problem Details (RFC 9457).

    Versionado: semántico sobre este documento (`info.version`). Los cambios
    compatibles suben la versión menor y se registran en `CHANGELOG.md`; un
    cambio incompatible exige una versión mayor y una ruta `/v2`.

servers:
  - url: http://localhost:3000
    description: Entorno local (Docker Compose)

security:
  - claveApi: []

tags:
  - name: actividades
    description: Recursos con cupo limitado (una materia, un partido, un turno).
  - name: reservas
    description: Asignación de un cupo a un participante.
  - name: cambios
    description: Feed ordenado de cambios para la reconciliación del tenant.

paths:
  /v1/actividades:
    post:
      tags: [actividades]
      operationId: crearActividad
      summary: Crear una actividad con cupo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaActividad"
      responses:
        "201":
          description: Actividad creada.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actividad"
          links:
            ConsultarActividad:
              operationId: consultarActividad
              parameters:
                id: $response.body#/id
            CambiarEstado:
              operationId: cambiarEstadoActividad
              parameters:
                id: $response.body#/id
            SolicitarReserva:
              operationId: solicitarReserva
              parameters:
                id: $response.body#/id
            ListarReservas:
              operationId: listarReservas
              parameters:
                id: $response.body#/id
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "415":
          $ref: "#/components/responses/TipoNoSoportado"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/actividades/{id}:
    parameters:
      - $ref: "#/components/parameters/IdActividad"
    get:
      tags: [actividades]
      operationId: consultarActividad
      summary: Consultar la actividad y sus cupos disponibles
      responses:
        "200":
          description: Actividad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actividad"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/NoDisponible"
    patch:
      tags: [actividades]
      operationId: cambiarEstadoActividad
      summary: Abrir o cerrar la admisión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [abierta, cerrada]
      responses:
        "200":
          description: Actividad con el estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actividad"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "415":
          $ref: "#/components/responses/TipoNoSoportado"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/actividades/{id}/reservas:
    parameters:
      - $ref: "#/components/parameters/IdActividad"
    post:
      tags: [reservas]
      operationId: solicitarReserva
      summary: Solicitar una reserva (admisión asíncrona)
      description: |
        Registra la reserva como `pendiente` y su comando en el outbox, en una
        única transacción, y responde `202`. La decisión la toma el worker.

        Repetir la solicitud con la misma `Idempotency-Key` y el mismo cuerpo
        devuelve la misma reserva con `200`; con otro cuerpo, `422`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Clave elegida por el cliente, única por tenant. Se reutiliza al reintentar.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: "^[\\x21-\\x7e]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NuevaReserva"
      responses:
        "202":
          description: Solicitud admitida; la reserva queda pendiente.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
          links:
            ConsultarReserva:
              operationId: consultarReserva
              parameters:
                id: $response.body#/id
            CancelarReserva:
              operationId: cancelarReserva
              parameters:
                id: $response.body#/id
        "200":
          description: Repetición idempotente; devuelve la reserva en su estado actual.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: El participante ya tiene una reserva activa o la actividad está cerrada.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "422":
          description: La Idempotency-Key ya se usó con otro cuerpo.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "415":
          $ref: "#/components/responses/TipoNoSoportado"
        "503":
          $ref: "#/components/responses/NoDisponible"
    get:
      tags: [reservas]
      operationId: listarReservas
      summary: Listado paginado por cursor (operación en contingencia)
      parameters:
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoReserva"
        - name: cursor
          in: query
          description: Valor de `siguiente_cursor` de la página anterior.
          schema:
            type: string
            minLength: 1
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Página de reservas en orden de creación.
          content:
            application/json:
              schema:
                type: object
                required: [datos, siguiente_cursor]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reserva"
                  siguiente_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/reservas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [reservas]
      operationId: consultarReserva
      summary: Consultar el estado de una reserva
      responses:
        "200":
          description: Reserva. Si está pendiente, incluye `Retry-After`.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/reservas/{id}/cancelacion:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [reservas]
      operationId: cancelarReserva
      summary: Solicitar la cancelación de una reserva (asíncrona)
      description: |
        Registra el pedido de cancelación y su comando en el outbox, en una
        única transacción, y responde `202`. El worker pasa la reserva a
        `cancelada` y, si estaba confirmada, devuelve el cupo.

        La operación es idempotente por naturaleza: cuando la reserva ya está
        cancelada responde `200`, y repetirla dentro de los 30 segundos de un
        pedido no genera un segundo comando. Por eso no requiere
        `Idempotency-Key`.

        **Confirmación.** El cliente consulta el resultado en `Location`
        respetando `Retry-After`, igual que con la reserva. Si 30 segundos
        después del pedido la reserva sigue activa, repetir la cancelación
        vuelve a registrar el comando: así se recupera un comando perdido. El
        worker ignora los comandos repetidos.
      responses:
        "202":
          description: Cancelación admitida; la reserva sigue activa hasta que el worker la procese.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "200":
          description: La reserva ya estaba cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "409":
          description: La reserva fue rechazada o falló; no hay cupo que devolver.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problema"
        "503":
          $ref: "#/components/responses/NoDisponible"

  /v1/cambios:
    get:
      tags: [cambios]
      operationId: leerCambios
      summary: Feed de cambios del tenant (reconciliación)
      description: |
        Cambios en orden de secuencia. Cada elemento trae la instantánea
        completa de la entidad con su versión: aplicarlo dos veces o fuera de
        orden no altera el resultado si el lector descarta versiones menores.
        Un lector que ya vio la secuencia *n* nunca verá aparecer después una
        menor.
      parameters:
        - name: desde
          in: query
          description: Última secuencia aplicada por el lector (punto de control).
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: limite
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Cambios posteriores a `desde`.
          content:
            application/json:
              schema:
                type: object
                required: [datos, ultima_secuencia]
                properties:
                  datos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Cambio"
                  ultima_secuencia:
                    type: integer
                    description: Nuevo punto de control para la próxima lectura.
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "503":
          $ref: "#/components/responses/NoDisponible"

components:
  securitySchemes:
    claveApi:
      type: http
      scheme: bearer
      description: Clave de API del tenant (256 bits). El servicio guarda solo su hash SHA-256.

  parameters:
    IdActividad:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    Location:
      description: Ruta del recurso creado o de la reserva a consultar.
      schema:
        type: string
    RetryAfter:
      description: Segundos sugeridos antes de volver a consultar.
      schema:
        type: integer

  responses:
    SolicitudInvalida:
      description: Cuerpo, cabecera o parámetro inválido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoAutenticado:
      description: Clave de API ausente o inválida.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoEncontrado:
      description: El recurso no existe o pertenece a otro tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    TipoNoSoportado:
      description: El cuerpo no se envió como `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
    NoDisponible:
      description: La base de datos no está disponible; reintentar con la misma Idempotency-Key.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"

  schemas:
    Metadata:
      description: JSON opaco de hasta 16 KB. El servicio lo almacena y lo devuelve sin interpretarlo.
      type: [object, "null"]

    NuevaActividad:
      type: object
      required: [nombre, capacidad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        capacidad:
          type: integer
          minimum: 1
          maximum: 100000
        metadata:
          $ref: "#/components/schemas/Metadata"

    Actividad:
      type: object
      required: [id, nombre, capacidad, cupos_disponibles, estado, version, metadata, creado_en]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7, ordenado por tiempo de creación.
        nombre:
          type: string
        capacidad:
          type: integer
        cupos_disponibles:
          type: integer
          minimum: 0
        estado:
          type: string
          enum: [abierta, cerrada]
        version:
          type: integer
          minimum: 1
        metadata:
          $ref: "#/components/schemas/Metadata"
        creado_en:
          type: string
          format: date-time

    NuevaReserva:
      type: object
      required: [participante]
      properties:
        participante:
          type: string
          minLength: 1
          maxLength: 128
          description: Identificador opaco del participante en el sistema del tenant.
        metadata:
          $ref: "#/components/schemas/Metadata"

    EstadoReserva:
      type: string
      enum: [pendiente, confirmada, rechazada, cancelada, fallida]

    Reserva:
      type: object
      required: [id, actividad_id, participante, estado, version, metadata, creado_en]
      properties:
        id:
          type: string
          format: uuid
        actividad_id:
          type: string
          format: uuid
        participante:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoReserva"
        version:
          type: integer
          minimum: 1
        metadata:
          $ref: "#/components/schemas/Metadata"
        creado_en:
          type: string
          format: date-time

    Cambio:
      type: object
      required: [secuencia, tipo, ocurrido_en, entidad]
      properties:
        secuencia:
          type: integer
        tipo:
          type: string
          description: |
            Tipo de cambio. Es una enumeración extensible: versiones menores
            del contrato pueden agregar tipos nuevos, y el lector debe aplicar
            la instantánea por su versión e ignorar los tipos que no conoce.
          x-extensible-enum:
            - actividad.creada
            - actividad.actualizada
            - reserva.solicitada
            - reserva.confirmada
            - reserva.rechazada
            - reserva.cancelada
            - reserva.fallida
        ocurrido_en:
          type: string
          format: date-time
        entidad:
          description: Instantánea completa de la entidad después del cambio.
          oneOf:
            - $ref: "#/components/schemas/Actividad"
            - $ref: "#/components/schemas/Reserva"

    EventoReserva:
      description: |
        Cuerpo de cada webhook. Tiene la misma forma que un elemento del feed,
        restringida a las decisiones del worker sobre una reserva.
      type: object
      required: [secuencia, tipo, ocurrido_en, entidad]
      properties:
        secuencia:
          type: integer
          minimum: 1
          description: Secuencia del cambio en el feed del tenant.
        tipo:
          type: string
          enum:
            - reserva.confirmada
            - reserva.rechazada
            - reserva.cancelada
            - reserva.fallida
        ocurrido_en:
          type: string
          format: date-time
        entidad:
          $ref: "#/components/schemas/Reserva"

    Problema:
      description: Problem Details (RFC 9457).
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          examples: ["urn:reserva-cupos:problema:actividad-cerrada"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

webhooks:
  cambioDeReserva:
    post:
      operationId: recibirCambioDeReserva
      summary: Notificación de una decisión sobre una reserva
      description: |
        El notificador hace un `POST` a la URL registrada por el tenant por
        cada decisión del worker sobre una reserva.

        **Secreto.** Al registrar el webhook, el servicio genera para el tenant
        un secreto de 32 bytes aleatorios y se lo entrega una sola vez,
        codificado en hexadecimal (64 caracteres). La clave del HMAC son esos
        32 bytes decodificados, **no** el texto hexadecimal.

        **Firma.** `X-Firma: t=<unix>,v1=<hex>`, donde `t` es la marca de
        tiempo Unix en segundos y `v1` es el HMAC-SHA256, con la clave del
        tenant, de `<t>.<cuerpo>` (la marca de tiempo, un punto y el cuerpo
        exacto recibido, en UTF-8), en hexadecimal en minúsculas. El receptor
        recalcula la firma, la compara en tiempo constante y descarta los
        mensajes con una marca de tiempo de más de 5 minutos: así se impiden la
        falsificación y la reinyección.

        **Vector de prueba.** `x-vector-de-prueba` trae un secreto, una marca
        de tiempo, un cuerpo y la cabecera `X-Firma` que les corresponde. Una
        implementación correcta del emisor obtiene esa cabecera, y una del
        receptor la acepta (tomando `t` como hora actual). Usar el texto
        hexadecimal como clave da otra firma.

        **Entrega al-menos-una-vez.** El mismo evento puede llegar más de una
        vez o fuera de orden. El receptor lo aplica solo si `entidad.version`
        es mayor que la que tiene guardada.

        **Reintentos.** Ante una respuesta distinta de `2xx`, o si la respuesta
        no termina de llegar en 5 segundos, el notificador reintenta a los
        10 s, 1 min y 5 min. Agotados los intentos, el evento queda en una cola
        de mensajes fallidos y sigue disponible en el feed.
      x-vector-de-prueba:
        secreto: 5c0f8e2a9b7d4e61c3a85f0b2d9e7a14f6c2b8d05e3a9f71c4b6e2d8a0f5c3b9
        t: 1794052805
        cuerpo: '{"secuencia":42,"tipo":"reserva.confirmada","ocurrido_en":"2026-11-07T12:00:00.000Z","entidad":{"id":"019a5f3c-2b7e-7c41-9d0e-6f1a2b3c4d5e","actividad_id":"019a5f3b-9a10-7f22-8c3d-1e2f3a4b5c6d","participante":"alumno-7","estado":"confirmada","version":2,"metadata":null,"creado_en":"2026-11-07T11:59:59.000Z"}}'
        X-Firma: t=1794052805,v1=aa174e714c7e4fc696991813aa46cdda33e1728a7991dfba335bcdfebe8a80d6
      security: []
      parameters:
        - name: X-Firma
          in: header
          required: true
          schema:
            type: string
            pattern: "^t=[0-9]+,v1=[0-9a-f]{64}$"
        - name: X-Webhook-Id
          in: header
          required: true
          description: Identificador del evento; se repite en cada reintento.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoReserva"
      responses:
        "200":
          description: Evento recibido.
        "204":
          description: Evento recibido.
        "401":
          description: Firma inválida o vencida. El notificador reintenta; el feed sigue disponible.
