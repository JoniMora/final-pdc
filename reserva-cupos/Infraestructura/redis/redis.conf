# Redis solo TLS en la red interna. Password exclusiva de desarrollo local.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"
requirepass redis_local_2026
appendonly yes
appendfsync everysec
maxmemory 256mb
# Nunca expulsar baldes y permitir mas solicitudes de las configuradas.
maxmemory-policy noeviction
