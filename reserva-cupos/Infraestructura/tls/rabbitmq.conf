listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /tls/ca.crt
ssl_options.certfile = /tls/rabbitmq.crt
ssl_options.keyfile = /tls/rabbitmq.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
# El puerto TCP debe ser numérico. HTTP solo dentro del contenedor; HTTPS para la red.
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
management.ssl.port = 15671
management.ssl.cacertfile = /tls/ca.crt
management.ssl.certfile = /tls/rabbitmq.crt
management.ssl.keyfile = /tls/rabbitmq.key

